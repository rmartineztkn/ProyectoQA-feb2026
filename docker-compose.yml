version: '3.8'

services:
  # Servicio 1: La Base de Datos (El Microservicio de datos)
  mongodb-server:
    image: mongo:latest
    container_name: mongo-qa
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  # Servicio 2: La interfaz visual (Para que tú como QA veas qué hay dentro)
  mongo-express:
    image: mongo-express
    container_name: mongo-visualizer
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb-server

volumes:
  mongo-data:
